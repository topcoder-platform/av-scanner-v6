# Bind for Compose sidecar access. In ECS awsvpc mode the task security group
# must deny inbound access to this unauthenticated listener.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

TCPSocket 3310
TCPAddr 0.0.0.0

# Keep application, transport, and expanded-content limits aligned.
StreamMaxLength 500M
MaxScanSize 500M
MaxFileSize 500M
PCREMaxFileSize 500M

ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
SelfCheck 600
ExitOnOOM yes

LogTime yes
ExtendedDetectionInfo yes
