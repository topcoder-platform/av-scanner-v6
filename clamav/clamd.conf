# The official image entrypoint requires one of its known local sockets before
# it considers clamd started. TCP remains available for the app sidecar; its
# address is rewritten to loopback for ECS and to the private bridge for Compose.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0

# Keep application, transport, and expanded-content limits aligned.
StreamMaxLength 500M
MaxScanSize 500M
MaxFileSize 500M
PCREMaxFileSize 500M

ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
SelfCheck 600
ExitOnOOM yes

LogTime yes
ExtendedDetectionInfo yes
